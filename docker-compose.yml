# Local development: hot-reload FE + BE. Database stays on the host (or elsewhere).
# From host MySQL, point DB_HOST at host.docker.internal (set below).
#
# Usage:
#   1. Ensure backend/.env and frontend/.env exist (from their .env.example)
#   2. docker compose up --build
#   3. FE http://localhost:5173  |  BE http://localhost:8000
#
# Migrations (once DB is reachable):
#   docker compose exec backend php artisan migrate
#   docker compose exec backend php artisan db:seed

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    env_file:
      - ./backend/.env
    environment:
      # Always use host gateway inside the container (do not inherit host DB_HOST=127.0.0.1)
      DB_HOST: host.docker.internal
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - ./frontend/.env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
      # Reliable file watching under Docker Desktop
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend

volumes:
  backend_vendor:
  frontend_node_modules:
